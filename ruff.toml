# ruff.toml
line-length = 90          
target-version = "py310"   
extend-exclude = [
    "outputs/",
    "libs/",               
    "src/crossweave/models/tips_image_encoder.py",
]

[lint]
select = [
    "E", "W", "F", "I", "UP", "B", "C4",
    "NPY", "ICN", "RET", "SIM", "RUF", "LOG",
    "T20", "ERA",
]
ignore = [
    "E741",                           
    "W191", "E111", "E114", "E117",   
    "RET504",                         
]

[lint.pycodestyle]
max-line-length = 120

[lint.per-file-ignores]
"__init__.py" = ["F401"]

[lint.isort]
known-first-party = ["crossweave"]
force-sort-within-sections = true
