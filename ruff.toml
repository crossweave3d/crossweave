# ruff.toml
line-length = 100
target-version = "py310"   # keep in sync with requires-python
extend-exclude = ["data/", "outputs/", "docs/"]

[lint]
select = [
    "E", "W", "F", "I", "UP", "B", "C4",
    "NPY", "ICN", "RET", "SIM", "RUF", "LOG",
]
ignore = [
    "E501",                         
    "E741",                         
    "W191", "E111", "E114", "E117", 
    "RET504",                       
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]

[lint.isort]
known-first-party = ["crossweave"]
force-sort-within-sections = true

[format]
docstring-code-format = true
docstring-code-line-length = "dynamic"